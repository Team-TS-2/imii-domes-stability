name: Deploy to AWS

# Trigger on push to main or second-branch
on:
  push:
    branches:
      - main
      - second-branch
    paths:
      - 'back-end/**'
      - '.github/workflows/deploy.yml'

# Only deploy one at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest
    
    # Set working directory
    defaults:
      run:
        working-directory: back-end
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: back-end/package-lock.json
      
      # 3. Install backend dependencies (includes CDK CLI)
      - name: Install dependencies
        run: npm ci
      
      # 4. Install Lambda layer dependencies
      - name: Install Lambda layer dependencies
        run: |
          cd lambda/layers/common/nodejs
          npm install
          cd ../../../..
      
      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      # 6. Verify AWS connection
      - name: Verify AWS connection
        run: aws sts get-caller-identity
      
      # 7. Verify CDK CLI version
      - name: Verify CDK CLI version
        run: npx cdk --version
      
      # 8. Check if CDK is bootstrapped
      - name: Check CDK Bootstrap
        run: |
          if ! aws ssm get-parameter --name /cdk-bootstrap/hnb659fds/version 2>/dev/null; then
            echo "❌ ERROR: AWS account not bootstrapped for CDK!"
            echo ""
            echo "Please run this command locally (one-time setup):"
            echo "  cd back-end"
            echo "  cdk bootstrap"
            echo ""
            echo "Then push your changes again to trigger deployment."
            exit 1
          fi
          echo "✅ CDK bootstrap detected"
      
      # 9. CDK Synth (validate)
      - name: CDK Synth
        run: npx cdk synth
      
      # 10. CDK Deploy
      - name: CDK Deploy
        run: npx cdk deploy --require-approval never
      
      # 11. Output API URL
      - name: Get API URL
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ImiiDomesBackendStack \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "🚀 Deployment successful!"
          echo "API URL: $API_URL"
          echo "API_URL=$API_URL" >> $GITHUB_ENV
      
      # 12. Comment on PR (if applicable)
      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Deployment successful!**\n\nAPI URL: `${{ env.API_URL }}`'
            })
